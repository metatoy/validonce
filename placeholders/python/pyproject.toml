[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "validonce"
version = "0.0.1.dev0"
description = "Placeholder for validonce: write validation rules once on the server, enforce them in React and Angular forms. Not usable yet."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Metatoy LLC" }]
maintainers = [{ name = "Metatoy LLC" }]
requires-python = ">=3.10"
classifiers = ["Development Status :: 1 - Planning"]

[project.urls]
Homepage = "https://github.com/metatoy/validonce"

[tool.hatch.build.targets.wheel]
packages = ["src/validonce"]
