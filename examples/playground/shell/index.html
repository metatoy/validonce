    <title>validonce Playground</title>
    <meta name="description" content="Pick a backend and a frontend, fill in a contact form, and watch the same rules run in the browser and on the server." />
    <script>
      // Set the theme before first paint: the saved choice, else the system's.
      try {
        var t = localStorage.getItem("playground-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
