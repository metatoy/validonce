#
# Serves the built form and proxies same-origin /api to the API, stripping the /api prefix
# (/api/openapi.json -> /openapi.json, /api/signups -> /signups), as the Vite dev proxy does.
# This copy is baked into the image for `docker run`; the Helm chart mounts its own from a
# ConfigMap so the API address can come from the release.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8010/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
