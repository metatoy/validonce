{{- if .Values.networkPolicy.enabled }}
# API: ingress only from this release's web pods and its helm test pod; no egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "validonce-demo.apiName" . }}
  labels:
    {{- include "validonce-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      {{- include "validonce-demo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "validonce-demo.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: web
        - podSelector:
            matchLabels:
              {{- include "validonce-demo.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: test
      ports:
        - port: http
          protocol: TCP
  egress: []
---
# Web: ingress from anywhere on its port; egress only to the API and to cluster DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "validonce-demo.webName" . }}
  labels:
    {{- include "validonce-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  podSelector:
    matchLabels:
      {{- include "validonce-demo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - port: http
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "validonce-demo.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      ports:
        - port: {{ .Values.api.containerPort }}
          protocol: TCP
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
