# Weekly, grouped version updates (minor and patch together, majors on their own).
# Security updates are separate and open as soon as an advisory lands.
version: 2
updates:
  - package-ecosystem: npm
    # No root package.json: list the pnpm workspace packages (the lockfile at the root is found).
    directories: ["/js", "/mcp", "/mcp/evals", "/testbeds/before", "/examples/angular-form", "/examples/react-form", "/examples/wrap-demo"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: nuget
    directories: ["/dotnet", "/conformance/regex/runners/dotnet", "/skills/validonce-migrate/scripts/dotnet-runner", "/testbeds/before/fluentvalidation"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      uv-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch, major]
