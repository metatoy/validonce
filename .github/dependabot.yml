# Weekly, grouped version updates (minor and patch together, majors on their own).
# Security updates are separate and open as soon as an advisory lands.
version: 2
updates:
  - package-ecosystem: npm
    # The root package.json makes this a pnpm workspace Dependabot understands: one PR per update covers every
    # workspace package and updates the root pnpm-lock.yaml.
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Types must match the oldest supported Node (engines: >=20), not the newest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Angular pins TypeScript to a narrow range (22.3: >=6.0 <6.1); take majors by hand with Angular.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: nuget
    directories: ["/dotnet", "/conformance/regex/runners/dotnet", "/skills/validonce-migrate/scripts/dotnet-runner", "/testbeds/before/fluentvalidation"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      uv-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch, major]
