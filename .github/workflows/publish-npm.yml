name: publish-npm
# Publishes the validonce npm package through npm trusted publishing (no stored token), with
# provenance. Runs when a GitHub Release is published (the tag must be v<js/package.json version>),
# or by hand. A version with a pre-release suffix (0.4.0-rc.1) is published under the `next` tag.
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the release tag matches js/package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./js/package.json').version")
          [ "$TAG" = "v$version" ] || { echo "release tag $TAG does not match js/package.json version $version"; exit 1; }
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Trusted publishing needs npm 11.5.1 or later
        run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - name: Build and test
        working-directory: js
        run: pnpm build && pnpm typecheck && pnpm test && pnpm lint
      - name: Publish
        working-directory: js
        run: |
          version=$(node -p "require('./package.json').version")
          case "$version" in
            *-*) npm publish --access public --provenance --tag next ;;
            *) npm publish --access public --provenance ;;
          esac
