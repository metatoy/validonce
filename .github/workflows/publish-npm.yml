name: publish-npm
# Publishes the validonce npm package through npm trusted publishing (no stored token), with
# provenance. Run by hand only, after the founder approves the release. The package version
# comes from js/package.json.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Trusted publishing needs npm 11.5.1 or later
        run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - name: Build and test
        working-directory: js
        run: pnpm build && pnpm typecheck && pnpm test && pnpm lint
      - name: Publish
        working-directory: js
        run: npm publish --access public --provenance
