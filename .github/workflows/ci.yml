name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ["10.0.x", "11.0.x"]
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.sdk }}
      - run: dotnet build -c Release
      - run: dotnet test -c Release

  js:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        working-directory: js
      - run: pnpm typecheck
        working-directory: js
      - run: pnpm test
        working-directory: js
      - run: pnpm lint
        working-directory: js
      - name: Example form builds
        run: pnpm typecheck && pnpm build
        working-directory: examples/react-form

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        pydantic: [lowest, highest]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test (lowest direct dependencies)
        if: matrix.pydantic == 'lowest'
        run: uv run --resolution lowest-direct pytest -q
      - name: Test (highest dependencies)
        if: matrix.pydantic == 'highest'
        run: uv run pytest -q
      - name: Ruff check
        if: matrix.python == '3.13' && matrix.pydantic == 'highest'
        run: uv run ruff check .
      - name: Ruff format check
        if: matrix.python == '3.13' && matrix.pydantic == 'highest'
        run: uv run ruff format --check .

  conformance-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --project python pytest -q python/tests/test_conformance_schema.py

  golden:
    # Regenerates each example backend's OpenAPI document and fails on any difference from the
    # committed copy, then checks the two backends export identical Signup rules.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: astral-sh/setup-uv@v6
      - name: Export ASP.NET OpenAPI
        working-directory: examples/aspnet-app
        run: dotnet run --no-launch-profile -- --export-openapi ../../conformance/golden/aspnet.openapi.json
      - name: Export FastAPI OpenAPI
        working-directory: examples/fastapi-app
        run: uv run python export_openapi.py ../../conformance/golden/fastapi.openapi.json
      - name: No drift from the committed golden files
        run: git diff --exit-code conformance/golden
      - name: Both backends export the same rules
        run: uv run --project python python scripts/check_golden.py

  e2e:
    # The React example form against each backend, in a real browser.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [aspnet, fastapi]
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        if: matrix.backend == 'aspnet'
        with:
          dotnet-version: 10.0.x
      - uses: astral-sh/setup-uv@v6
        if: matrix.backend == 'fastapi'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        working-directory: js
      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: examples/react-form
      - name: Start ASP.NET
        if: matrix.backend == 'aspnet'
        working-directory: examples/aspnet-app
        run: |
          dotnet build -c Release
          nohup dotnet run -c Release --no-build --no-launch-profile --urls http://localhost:5080 > backend.log 2>&1 &
          echo "VALIDONCE_API=http://localhost:5080" >> "$GITHUB_ENV"
      - name: Start FastAPI
        if: matrix.backend == 'fastapi'
        working-directory: examples/fastapi-app
        run: |
          uv sync
          nohup uv run uvicorn app:app --port 8010 > backend.log 2>&1 &
          echo "VALIDONCE_API=http://localhost:8010" >> "$GITHUB_ENV"
      - name: Wait for the backend
        run: for i in $(seq 1 90); do curl -s -o /dev/null "$VALIDONCE_API/" && exit 0; sleep 1; done; exit 1
      - name: End-to-end tests
        run: pnpm e2e
        working-directory: examples/react-form
      - name: Backend log
        if: failure()
        run: cat examples/*-app/backend.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.backend }}
          path: examples/react-form/e2e/screenshots/
