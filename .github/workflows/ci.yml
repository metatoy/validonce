name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ["10.0.x", "11.0.x"]
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.sdk }}
      - run: dotnet build -c Release
      - run: dotnet test -c Release

  js:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        working-directory: js
      - run: pnpm typecheck
        working-directory: js
      - run: pnpm test
        working-directory: js
      - run: pnpm lint
        working-directory: js
      - name: Example form builds
        run: pnpm typecheck && pnpm build
        working-directory: examples/react-form
      - name: Fastify example typechecks
        run: pnpm typecheck
        working-directory: examples/fastify-app
      - name: NestJS example typechecks
        run: pnpm typecheck
        working-directory: examples/nestjs-app
      - name: DOM example builds
        run: pnpm typecheck && pnpm build
        working-directory: examples/dom-form
      - name: Kubernetes example builds
        run: pnpm build
        working-directory: examples/k8s-form
      - name: Generator plugins regenerate cleanly and enforce the rules
        # kubb, Hey API and orval each regenerate their client from the golden Signup OpenAPI with the
        # validonce plugin; the committed output must not change, and the generated schemas must
        # enforce the three Signup rules.
        if: matrix.node == 22
        run: |
          for e in kubb hey-api orval; do
            (cd "examples/codegen-clients/$e" && pnpm generate && pnpm test) || exit 1
          done
          git diff --exit-code examples/codegen-clients
          test -z "$(git status --porcelain examples/codegen-clients)" || { git status --porcelain examples/codegen-clients; echo "generated output is stale"; exit 1; }
      - name: Angular example builds
        # Angular 22's CLI needs Node 22.22.3 or later; the library itself supports Node 20.
        if: matrix.node == 22
        run: pnpm typecheck && pnpm build
        working-directory: examples/angular-form
      - name: Vue example builds
        run: pnpm typecheck && pnpm build
        working-directory: examples/vue-form

  e2e-k8s:
    # The Kubernetes example form: rules translated from the sample CRD's CEL run in the browser; the
    # untranslatable rule comes back through a recorded dry-run Status. No cluster needed.
    runs-on: ubuntu-latest
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        working-directory: js
      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: examples/k8s-form
      - name: End-to-end tests
        run: pnpm e2e
        working-directory: examples/k8s-form

  k8s-cel-diff:
    # Differential test: Kubernetes' own CEL (Go) against the translated rules (TypeScript). Not a required check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: tools/k8s-cel-diff/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        working-directory: js
      - name: Kubernetes verdicts
        working-directory: tools/k8s-cel-diff
        run: go vet ./... && mkdir -p out && go run . -json > out/verdicts.json
      - name: Fixtures are up to date
        working-directory: tools/k8s-cel-diff
        run: node gen-fixtures.mjs && git diff --exit-code -- ../../conformance/kubernetes
      - name: Translate, evaluate, compare
        working-directory: tools/k8s-cel-diff
        run: node translate-and-eval.mjs out/verdicts.json

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        pydantic: [lowest, highest]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Test (lowest direct dependencies)
        if: matrix.pydantic == 'lowest'
        run: uv run --resolution lowest-direct pytest -q
      - name: Test (highest dependencies)
        if: matrix.pydantic == 'highest'
        run: uv run pytest -q
      - name: Ruff check
        if: matrix.python == '3.13' && matrix.pydantic == 'highest'
        run: uv run ruff check .
      - name: Ruff format check
        if: matrix.python == '3.13' && matrix.pydantic == 'highest'
        run: uv run ruff format --check .

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: |
            go/go.sum
            examples/go-app/go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: Example builds and vets
        working-directory: examples/go-app
        run: go vet ./... && go build ./... && go test ./... && go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
  java:
    # Gradle build: the evaluator on the 125 shared cases (both sides), the Spring integration and the
    # example app, plus an unsigned dry-run of the Central Portal bundle.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew check
      - name: Unsigned dry-run bundle
        run: ./gradlew centralBundle
      - name: Signed bundle with a throwaway key (the publish workflow's in-memory signing path)
        run: |
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --pinentry-mode loopback --passphrase ci --quick-gen-key "validonce CI test <test@example.invalid>" ed25519 sign 1d
          export VALIDONCE_SIGNING_PASSWORD=ci
          VALIDONCE_SIGNING_KEY=$(gpg --batch --pinentry-mode loopback --passphrase ci --armor --export-secret-keys)
          export VALIDONCE_SIGNING_KEY
          ./gradlew centralBundle -Pvalidonce.sign
          bundle=$(ls build/central/validonce-*-bundle.zip)
          dir=$(mktemp -d) && unzip -q "$bundle" -d "$dir"
          jar=$(find "$dir" -name 'validonce-core-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          gpg --verify "$jar.asc" "$jar"
          [ "$(find "$dir" -name '*.asc' | wc -l)" -ge 10 ] || { echo "too few signatures"; exit 1; }

  examples:
    # The example backends' own tests (the Signup and Contact contracts, the 16 KB body cap, CORS),
    # then each backend's container image: built, started, and checked through curl or wget, which
    # Coolify needs inside the image for its health check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: astral-sh/setup-uv@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        working-directory: js
      - name: ASP.NET example tests
        run: dotnet test examples/aspnet-app.Tests -c Release
      - name: FastAPI example tests
        working-directory: examples/fastapi-app
        run: uv run --group dev pytest -q test_app.py
      - name: Fastify and NestJS example tests
        run: |
          pnpm --dir examples/fastify-app test
          pnpm --dir examples/nestjs-app test

  images:
    # The playground's container images, one per backend.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: aspnet, dockerfile: examples/aspnet-app/Dockerfile, port: 5080, health: /openapi/v1.json, probe: curl }
          - { name: fastapi, dockerfile: examples/fastapi-app/Dockerfile, port: 8010, health: /openapi.json, probe: curl }
          - { name: fastify, dockerfile: examples/fastify-app/Dockerfile, port: 8020, health: /, probe: curl }
          - { name: nestjs, dockerfile: examples/nestjs-app/Dockerfile, port: 8030, health: /, probe: curl }
          - { name: go, dockerfile: examples/go-app/Dockerfile, port: 8040, health: /healthz, probe: wget }
          - { name: spring, dockerfile: examples/spring-app/Dockerfile, port: 8050, health: /healthz, probe: wget }
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -f ${{ matrix.dockerfile }} -t validonce-${{ matrix.name }} .
      - name: Start and check health from inside the container
        run: |
          docker run -d --name app validonce-${{ matrix.name }}
          for i in $(seq 1 60); do
            if [ "${{ matrix.probe }}" = curl ]; then
              docker exec app curl -fsS -o /dev/null http://127.0.0.1:${{ matrix.port }}${{ matrix.health }} && ok=1 && break
            else
              docker exec app wget -q -O /dev/null http://127.0.0.1:${{ matrix.port }}${{ matrix.health }} && ok=1 && break
            fi
            sleep 2
          done
          docker logs app | tail -20
          [ "${ok:-}" = 1 ] || { echo "::error::${{ matrix.name }} image did not become healthy"; exit 1; }

  e2e-playground-frames:
    # The playground's four Contact forms (React, Angular, Vue, web components) against a stub OpenAPI
    # document and a stub 422: errors under the right fields, the server badge, postMessage events.
    runs-on: ubuntu-latest
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        working-directory: js
      - name: Build the four frames
        run: for fw in react angular vue dom; do pnpm --filter "validonce-playground-frame-$fw" build || exit 1; done
      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: examples/playground/frames/e2e
      - name: End-to-end tests
        run: pnpm --filter validonce-playground-frames-e2e e2e

  conformance-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --project python pytest -q python/tests/test_conformance_schema.py

  golden:
    # Regenerates each example backend's OpenAPI document and fails on any difference from the
    # committed copy, then checks every backend exports identical Signup rules.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: astral-sh/setup-uv@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        working-directory: js
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: examples/go-app/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Export ASP.NET OpenAPI
        working-directory: examples/aspnet-app
        run: dotnet run --no-launch-profile -- --export-openapi ../../conformance/golden/aspnet.openapi.json
      - name: Export FastAPI OpenAPI
        working-directory: examples/fastapi-app
        run: uv run python export_openapi.py ../../conformance/golden/fastapi.openapi.json
      - name: Export Fastify OpenAPI
        working-directory: examples/fastify-app
        run: pnpm export-openapi ../../conformance/golden/fastify.openapi.json
      - name: Export NestJS OpenAPI
        working-directory: examples/nestjs-app
        run: pnpm export-openapi ../../conformance/golden/nestjs.openapi.json
      - name: Export Go OpenAPI
        working-directory: examples/go-app
        run: go run . --export-openapi ../../conformance/golden/go.openapi.json
      - name: Export Spring OpenAPI
        working-directory: java
        run: ./gradlew :spring-app:exportOpenApi
      - name: No drift from the committed golden files
        run: git diff --exit-code conformance/golden
      - name: Every backend exports the same rules
        run: uv run --project python python scripts/check_golden.py

  e2e:
    # Chromium jobs keep the plain "e2e (framework, backend)" name: the main branch ruleset requires
    # those check names. Other browsers get a suffix.
    name: e2e (${{ matrix.framework }}, ${{ matrix.backend }}${{ matrix.browser != 'chromium' && format(', {0}', matrix.browser) || '' }})
    # The React, Angular, DOM and Vue example forms against each backend, in a real browser. The DOM
    # form (native validity, ElementInternals) also runs on Firefox and WebKit.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [react, angular, dom, vue]
        backend: [aspnet, fastapi]
        # React runs against every backend; each other frontend only against ASP.NET and FastAPI.
        browser: [chromium]
        include:
          - { framework: react, backend: fastify, browser: chromium }
          - { framework: react, backend: nestjs, browser: chromium }
          - { framework: react, backend: go, browser: chromium }
          - { framework: dom, backend: aspnet, browser: firefox }
          - { framework: dom, backend: aspnet, browser: webkit }
          - { framework: dom, backend: fastapi, browser: firefox }
          - { framework: dom, backend: fastapi, browser: webkit }
          - { framework: react, backend: spring, browser: chromium }
    env:
      CI: "1"
      PW_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v6
        if: matrix.backend == 'aspnet'
        with:
          dotnet-version: 10.0.x
      - uses: astral-sh/setup-uv@v7
        if: matrix.backend == 'fastapi'
      - uses: actions/setup-go@v6
        if: matrix.backend == 'go'
        with:
          go-version: stable
          cache-dependency-path: examples/go-app/go.sum
      - uses: actions/setup-java@v5
        if: matrix.backend == 'spring'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        if: matrix.backend == 'spring'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        working-directory: js
      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
        working-directory: examples/${{ matrix.framework }}-form
      - name: Start ASP.NET
        if: matrix.backend == 'aspnet'
        working-directory: examples/aspnet-app
        run: |
          dotnet build -c Release
          nohup dotnet run -c Release --no-build --no-launch-profile --urls http://localhost:5080 > backend.log 2>&1 &
          echo "VALIDONCE_API=http://localhost:5080" >> "$GITHUB_ENV"
      - name: Start FastAPI
        if: matrix.backend == 'fastapi'
        working-directory: examples/fastapi-app
        run: |
          uv sync
          # Run from the virtual environment, not through `uv run`, so no uv process holds the
          # cache lock while the server is up.
          nohup .venv/bin/uvicorn app:app --port 8010 > backend.log 2>&1 &
          echo "VALIDONCE_API=http://localhost:8010" >> "$GITHUB_ENV"
      - name: Start Fastify
        if: matrix.backend == 'fastify'
        working-directory: examples/fastify-app
        run: |
          pnpm build
          nohup node dist/main.js > backend.log 2>&1 &
          echo "VALIDONCE_API=http://localhost:8020" >> "$GITHUB_ENV"
      - name: Start NestJS
        if: matrix.backend == 'nestjs'
        working-directory: examples/nestjs-app
        run: |
          pnpm build
          nohup node dist/main.js > backend.log 2>&1 &
          echo "VALIDONCE_API=http://localhost:8030" >> "$GITHUB_ENV"
      - name: Start Go
        if: matrix.backend == 'go'
        working-directory: examples/go-app
        run: |
          go build -o go-app .
          nohup ./go-app > backend.log 2>&1 &
          echo "VALIDONCE_API=http://localhost:8040" >> "$GITHUB_ENV"
      - name: Start Spring
        if: matrix.backend == 'spring'
        working-directory: java
        run: |
          ./gradlew :spring-app:bootJar
          nohup java -jar ../examples/spring-app/build/libs/spring-app.jar > ../examples/spring-app/backend.log 2>&1 &
          echo "VALIDONCE_API=http://localhost:8050" >> "$GITHUB_ENV"
      - name: Wait for the backend
        run: for i in $(seq 1 90); do curl -s -o /dev/null "$VALIDONCE_API/" && exit 0; sleep 1; done; exit 1
      - name: End-to-end tests
        run: pnpm e2e
        working-directory: examples/${{ matrix.framework }}-form
      - name: Stop the backend
        if: always()
        run: |
          for port in 5080 8010 8020 8030 8040 8050; do
            pids=$(lsof -t -iTCP:$port -sTCP:LISTEN || true)
            [ -n "$pids" ] && kill $pids || true
          done
      - name: Backend log
        if: failure()
        run: cat examples/*-app/backend.log || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ matrix.framework }}-${{ matrix.backend }}-${{ matrix.browser }}
          path: examples/${{ matrix.framework }}-form/e2e/screenshots/

  regex-oracle:
    # Runs the regex fixtures on five real engines (V8 with and without `u`, Python re, Rust regex
    # through Pydantic, .NET) and fails when any engine's result differs from a fixture's expectation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: astral-sh/setup-uv@v7
      - name: Run the fixtures on every engine
        run: |
          node conformance/regex/runners/js.mjs conformance/regex > "$RUNNER_TEMP/js.json"
          uv run --python 3.14 --project python python conformance/regex/runners/py_runner.py conformance/regex > "$RUNNER_TEMP/py.json"
          dotnet run --project conformance/regex/runners/dotnet -c Release -- conformance/regex > "$RUNNER_TEMP/dotnet.json"
      - name: Every engine matches every expectation
        run: uv run --project python python scripts/check_regex_oracle.py "$RUNNER_TEMP/js.json" "$RUNNER_TEMP/py.json" "$RUNNER_TEMP/dotnet.json"
      - name: Suggested rewrites never hide a difference
        run: |
          dotnet build dotnet/src/Validonce.Cli -c Release
          uv run --python 3.14 --project python python scripts/check_rewrites.py "$RUNNER_TEMP/rewrites"
      - name: Runner self-test
        run: |
          node conformance/regex/runners/js.mjs conformance/regex/runners/testdata > "$RUNNER_TEMP/self-js.json"
          uv run --python 3.14 --project python python conformance/regex/runners/py_runner.py conformance/regex/runners/testdata > "$RUNNER_TEMP/self-py.json"
          dotnet run --project conformance/regex/runners/dotnet -c Release -- conformance/regex/runners/testdata > "$RUNNER_TEMP/self-dotnet.json"
          uv run --project python python scripts/check_regex_oracle.py --fixtures conformance/regex/runners/testdata "$RUNNER_TEMP/self-js.json" "$RUNNER_TEMP/self-py.json" "$RUNNER_TEMP/self-dotnet.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regex-oracle-results
          path: |
            ${{ runner.temp }}/js.json
            ${{ runner.temp }}/py.json
            ${{ runner.temp }}/dotnet.json
