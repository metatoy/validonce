name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ["10.0.x", "11.0.x"]
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.sdk }}
      - run: dotnet build -c Release
      - run: dotnet test -c Release

  js:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        working-directory: js
      - run: pnpm typecheck
        working-directory: js
      - run: pnpm test
        working-directory: js
      - run: pnpm lint
        working-directory: js
      - name: Example form builds
        run: pnpm typecheck && pnpm build
        working-directory: examples/react-form
      - name: Fastify example typechecks
        run: pnpm typecheck
        working-directory: examples/fastify-app
      - name: NestJS example typechecks
        run: pnpm typecheck
        working-directory: examples/nestjs-app
      - name: Angular example builds
        # Angular 22's CLI needs Node 22.22.3 or later; the library itself supports Node 20.
        if: matrix.node == 22
        run: pnpm typecheck && pnpm build
        working-directory: examples/angular-form

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        pydantic: [lowest, highest]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Test (lowest direct dependencies)
        if: matrix.pydantic == 'lowest'
        run: uv run --resolution lowest-direct pytest -q
      - name: Test (highest dependencies)
        if: matrix.pydantic == 'highest'
        run: uv run pytest -q
      - name: Ruff check
        if: matrix.python == '3.13' && matrix.pydantic == 'highest'
        run: uv run ruff check .
      - name: Ruff format check
        if: matrix.python == '3.13' && matrix.pydantic == 'highest'
        run: uv run ruff format --check .

  conformance-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --project python pytest -q python/tests/test_conformance_schema.py

  golden:
    # Regenerates each example backend's OpenAPI document and fails on any difference from the
    # committed copy, then checks every backend exports identical Signup rules.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: astral-sh/setup-uv@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        working-directory: js
      - name: Export ASP.NET OpenAPI
        working-directory: examples/aspnet-app
        run: dotnet run --no-launch-profile -- --export-openapi ../../conformance/golden/aspnet.openapi.json
      - name: Export FastAPI OpenAPI
        working-directory: examples/fastapi-app
        run: uv run python export_openapi.py ../../conformance/golden/fastapi.openapi.json
      - name: Export Fastify OpenAPI
        working-directory: examples/fastify-app
        run: pnpm export-openapi ../../conformance/golden/fastify.openapi.json
      - name: Export NestJS OpenAPI
        working-directory: examples/nestjs-app
        run: pnpm export-openapi ../../conformance/golden/nestjs.openapi.json
      - name: No drift from the committed golden files
        run: git diff --exit-code conformance/golden
      - name: Every backend exports the same rules
        run: uv run --project python python scripts/check_golden.py

  e2e:
    # The React and Angular example forms against each backend, in a real browser.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [react, angular]
        backend: [aspnet, fastapi]
        # React runs against every backend; each other frontend only against ASP.NET and FastAPI.
        include:
          - { framework: react, backend: fastify }
          - { framework: react, backend: nestjs }
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v6
        if: matrix.backend == 'aspnet'
        with:
          dotnet-version: 10.0.x
      - uses: astral-sh/setup-uv@v7
        if: matrix.backend == 'fastapi'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        working-directory: js
      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: examples/${{ matrix.framework }}-form
      - name: Start ASP.NET
        if: matrix.backend == 'aspnet'
        working-directory: examples/aspnet-app
        run: |
          dotnet build -c Release
          nohup dotnet run -c Release --no-build --no-launch-profile --urls http://localhost:5080 > backend.log 2>&1 &
          echo "VALIDONCE_API=http://localhost:5080" >> "$GITHUB_ENV"
      - name: Start FastAPI
        if: matrix.backend == 'fastapi'
        working-directory: examples/fastapi-app
        run: |
          uv sync
          # Run from the virtual environment, not through `uv run`, so no uv process holds the
          # cache lock while the server is up.
          nohup .venv/bin/uvicorn app:app --port 8010 > backend.log 2>&1 &
          echo "VALIDONCE_API=http://localhost:8010" >> "$GITHUB_ENV"
      - name: Start Fastify
        if: matrix.backend == 'fastify'
        working-directory: examples/fastify-app
        run: |
          pnpm build
          nohup node dist/main.js > backend.log 2>&1 &
          echo "VALIDONCE_API=http://localhost:8020" >> "$GITHUB_ENV"
      - name: Start NestJS
        if: matrix.backend == 'nestjs'
        working-directory: examples/nestjs-app
        run: |
          pnpm build
          nohup node dist/main.js > backend.log 2>&1 &
          echo "VALIDONCE_API=http://localhost:8030" >> "$GITHUB_ENV"
      - name: Wait for the backend
        run: for i in $(seq 1 90); do curl -s -o /dev/null "$VALIDONCE_API/" && exit 0; sleep 1; done; exit 1
      - name: End-to-end tests
        run: pnpm e2e
        working-directory: examples/${{ matrix.framework }}-form
      - name: Stop the backend
        if: always()
        run: |
          for port in 5080 8010 8020 8030; do
            pids=$(lsof -t -iTCP:$port -sTCP:LISTEN || true)
            [ -n "$pids" ] && kill $pids || true
          done
      - name: Backend log
        if: failure()
        run: cat examples/*-app/backend.log || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ matrix.framework }}-${{ matrix.backend }}
          path: examples/${{ matrix.framework }}-form/e2e/screenshots/

  regex-oracle:
    # Runs the regex fixtures on five real engines (V8 with and without `u`, Python re, Rust regex
    # through Pydantic, .NET) and fails when any engine's result differs from a fixture's expectation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: astral-sh/setup-uv@v7
      - name: Run the fixtures on every engine
        run: |
          node conformance/regex/runners/js.mjs conformance/regex > "$RUNNER_TEMP/js.json"
          uv run --python 3.14 --project python python conformance/regex/runners/py_runner.py conformance/regex > "$RUNNER_TEMP/py.json"
          dotnet run --project conformance/regex/runners/dotnet -c Release -- conformance/regex > "$RUNNER_TEMP/dotnet.json"
      - name: Every engine matches every expectation
        run: uv run --project python python scripts/check_regex_oracle.py "$RUNNER_TEMP/js.json" "$RUNNER_TEMP/py.json" "$RUNNER_TEMP/dotnet.json"
      - name: Suggested rewrites never hide a difference
        run: |
          dotnet build dotnet/src/Validonce.Cli -c Release
          uv run --python 3.14 --project python python scripts/check_rewrites.py "$RUNNER_TEMP/rewrites"
      - name: Runner self-test
        run: |
          node conformance/regex/runners/js.mjs conformance/regex/runners/testdata > "$RUNNER_TEMP/self-js.json"
          uv run --python 3.14 --project python python conformance/regex/runners/py_runner.py conformance/regex/runners/testdata > "$RUNNER_TEMP/self-py.json"
          dotnet run --project conformance/regex/runners/dotnet -c Release -- conformance/regex/runners/testdata > "$RUNNER_TEMP/self-dotnet.json"
          uv run --project python python scripts/check_regex_oracle.py --fixtures conformance/regex/runners/testdata "$RUNNER_TEMP/self-js.json" "$RUNNER_TEMP/self-py.json" "$RUNNER_TEMP/self-dotnet.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regex-oracle-results
          path: |
            ${{ runner.temp }}/js.json
            ${{ runner.temp }}/py.json
            ${{ runner.temp }}/dotnet.json
