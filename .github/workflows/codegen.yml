name: codegen

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  golden:
    # generate_code writes C# and Python for the Signup rules and every conformance rule set; both must
    # compile/import and export exactly the rules they were generated from.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        working-directory: js
      - name: Generate, compile, export, compare
        run: bash ./run.sh
        working-directory: mcp/test/golden

  golden-targets:
    # generate_code writes Go, Java, TypeScript rule builders (Fastify, NestJS), Vue and DOM code; all of it must
    # compile (go build/vet, javac via Gradle, tsc, vue-tsc) and export exactly the rules it was generated from.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        working-directory: js
      - name: Generate, compile, export, compare
        run: bash ./run-targets.sh
        working-directory: mcp/test/golden
