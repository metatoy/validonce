name: codegen

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  golden:
    # generate_code writes C# and Python for the Signup rules and every conformance rule set; both must
    # compile/import and export exactly the rules they were generated from.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        working-directory: js
      - name: Generate, compile, export, compare
        run: ./run.sh
        working-directory: mcp/test/golden
