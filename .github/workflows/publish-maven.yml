name: publish-maven
# Publishes com.metatoy:validonce-core and com.metatoy:validonce-spring to Maven Central.
# Maven Central has no token-free trusted publishing, so this job uses secrets from the protected
# `maven-central` environment: a signing key made only for CI (not the founder's personal key) and a
# Central Portal user token. The environment only allows release tags and needs the founder's approval
# for every run. Tests run first; the signed bundle gets a build provenance attestation and, for a
# Release, is attached to it. Runs when a GitHub Release is published (tag v<version in
# java/gradle.properties>), or by hand for an existing release tag (then from the current commit).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v0.4.0"
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: write # attach the bundle to the Release
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    defaults:
      run:
        working-directory: java
    steps:
      # A Release builds its tag. A manual run builds the commit it runs on (normally main), so a fix to
      # the build can publish an earlier version; the version check below still has to match the tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Check the release tag matches java/gradle.properties
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          [ "$TAG" = "v$version" ] || { echo "release tag $TAG does not match java/gradle.properties version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Test before building
        run: ./gradlew check
      - name: Build the signed bundle
        env:
          VALIDONCE_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          VALIDONCE_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          ./gradlew centralBundle -Pvalidonce.sign
          bundle="build/central/validonce-$VERSION-bundle.zip"
          unzip -l "$bundle" | grep -q '\.asc$' || { echo "::error::the bundle has no signatures"; exit 1; }
          echo "BUNDLE=java/$bundle" >> "$GITHUB_ENV"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.BUNDLE }}
      - name: Upload to the Central Portal and publish
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        working-directory: .
        run: |
          auth=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          id=$(curl -fsS -X POST -H "Authorization: Bearer $auth" \
            -F "bundle=@$BUNDLE" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=validonce-$VERSION&publishingType=AUTOMATIC")
          echo "deployment $id"
          # Validation, then publishing, usually takes a few minutes; wait up to 30.
          for i in $(seq 1 60); do
            state=$(curl -fsS -X POST -H "Authorization: Bearer $auth" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$id" | jq -r .deploymentState)
            echo "state: $state"
            case "$state" in
              PUBLISHED) exit 0 ;;
              FAILED) curl -fsS -X POST -H "Authorization: Bearer $auth" "https://central.sonatype.com/api/v1/publisher/status?id=$id" | jq .errors; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::deployment $id did not finish in 30 minutes; check central.sonatype.com/publishing/deployments"
          exit 1
      - name: Attach the bundle to the Release
        if: github.event_name == 'release'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$BUNDLE" --clobber
