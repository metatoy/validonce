name: mcp

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mcp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      # validonce-mcp imports the built validonce package.
      - run: pnpm build
        working-directory: js
      - run: pnpm build
        working-directory: mcp
      - run: pnpm typecheck
        working-directory: mcp
      - run: pnpm test
        working-directory: mcp
      - name: The packed package installs from its tarball and starts (no workspace links, no runtime deps)
        working-directory: mcp
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/install" && cd "$RUNNER_TEMP/install"
          echo '{"name":"smoke-install","private":true}' > package.json
          npm install --no-audit --no-fund "$RUNNER_TEMP"/validonce-mcp-*.tgz
          node "$GITHUB_WORKSPACE/mcp/scripts/smoke.mjs" ./node_modules/.bin/validonce-mcp
