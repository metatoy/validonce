name: mcp

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mcp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      # validonce-mcp imports the built validonce package.
      - run: pnpm build
        working-directory: js
      - run: pnpm build
        working-directory: mcp
      - run: pnpm typecheck
        working-directory: mcp
      - run: pnpm test
        working-directory: mcp
