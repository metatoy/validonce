name: labeler
# Labels pull requests by the paths they change. pull_request_target runs this workflow from
# main, so it never executes code from the pull request; it only reads the changed file list.
on:
  pull_request_target:
permissions:
  contents: read
jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v7
