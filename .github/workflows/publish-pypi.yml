name: publish-pypi
# Publishes the Python package to PyPI through trusted publishing (no stored token).
# Runs when a GitHub Release is published (the tag must be v<version in python/pyproject.toml>),
# or by hand. Tests run first. The wheel and sdist get a GitHub build provenance attestation and, for
# a Release, are attached to it, so `gh attestation verify <file> -R metatoy/validonce` works on them
# (PyPI also stores its own trusted-publishing attestations).
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Check the release tag matches python/pyproject.toml
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml | head -1)
          [ "$TAG" = "v$version" ] || { echo "release tag $TAG does not match pyproject.toml version $version"; exit 1; }
      - name: Test before building
        working-directory: python
        run: uv run pytest -q
      - run: uv build --out-dir "$GITHUB_WORKSPACE/dist"
        working-directory: python
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Attach the wheel and sdist to the Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
