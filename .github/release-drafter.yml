# Drafts the next release's notes from merged pull requests. Publishing the draft starts the
# npm, NuGet and PyPI publish workflows, which check the tag against each package's version.
name-template: "validonce $RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: Added
    labels: [feature, enhancement]
  - title: Fixed
    labels: [bug, fix]
  - title: Docs
    labels: [docs]
  - title: Maintenance
    labels: [ci, dependencies, chore]
change-template: "- $TITLE (#$NUMBER)"
exclude-labels: [skip-changelog]
version-resolver:
  major:
    labels: [breaking]
  minor:
    labels: [feature, enhancement]
  default: patch
template: |
  $CHANGES

  Full changelog: CHANGELOG.md
