[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "validonce"
version = "0.0.0"
description = "Validate once, enforce everywhere: shared validation rules."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Metatoy LLC" }]
dependencies = ["pydantic>=2.9,<3"]

[project.urls]
Repository = "https://github.com/metatoy/validonce"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4.18", "fastapi>=0.115", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/validonce"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
